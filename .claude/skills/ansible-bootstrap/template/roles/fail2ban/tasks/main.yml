---
# fail2ban ships in EPEL on RedHat-family systems.
- name: Enable EPEL (RedHat)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  register: fail2ban_epel
  when: ansible_facts['os_family'] == 'RedHat'

# Check mode: a package that is only about to be installed has no service yet,
# and dnf can't resolve fail2ban before EPEL exists.
- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  register: fail2ban_install
  when: not (ansible_check_mode and fail2ban_epel is changed)

- name: Configure and enable fail2ban
  when: not (ansible_check_mode and (fail2ban_epel is changed or fail2ban_install is changed))
  block:
    - name: Configure sshd jail
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started
